<style>
/* One look: the black vector-display screen of a 1991 color Mac, centered, with phone controls in the margins. */
:root {
  --bg: #000000; --fg: #ffffff; --dim: #8a8f99; --line: #2b2f36; --accent: #00ff00; --warn: #ff3030;
  --ui: Geneva, "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#app { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; }
#screen { position: relative; width: min(100%, calc((100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 512 / 342));
  max-width: 100%; aspect-ratio: 512 / 342; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: pointer; }

/* touch controls */
#touchUI { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 5; }
.ctl { position: absolute; pointer-events: auto; display: flex; align-items: center; justify-content: center;
  color: var(--fg); border: 1.5px solid rgba(255,255,255,.55); background: rgba(0,0,0,.35); font: 700 12px/1 var(--ui); letter-spacing: .08em; }
.ctl.down { background: rgba(0,255,0,.35); border-color: var(--accent); }
.gamectl { visibility: hidden; }
body.ingame .gamectl { visibility: visible; }
#stick { left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 124px; height: 124px; border-radius: 50%; }
#knob { width: 52px; height: 52px; border-radius: 50%; background: rgba(0,255,0,.45); border: 1.5px solid var(--accent); pointer-events: none; }
#bFire { right: calc(22px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 96px; height: 96px; border-radius: 50%; font-size: 15px; border-color: var(--accent); }
#bGren { right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(128px + env(safe-area-inset-bottom, 0px)); width: 54px; height: 54px; border-radius: 50%; font-size: 10px; }
#bHyper { right: calc(80px + env(safe-area-inset-right, 0px)); bottom: calc(128px + env(safe-area-inset-bottom, 0px)); width: 54px; height: 54px; border-radius: 50%; font-size: 10px; border-color: var(--warn); }
#bView { right: calc(22px + env(safe-area-inset-right, 0px)); bottom: calc(194px + env(safe-area-inset-bottom, 0px)); width: 104px; height: 32px; border-radius: 6px; font-size: 11px; }
#bPause { left: calc(14px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); width: 44px; height: 36px; border-radius: 6px; font-size: 14px; }
#bQuit { left: calc(66px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); width: 64px; height: 36px; border-radius: 6px; font-size: 11px; display: none; border-color: var(--warn); }
#bSound { right: calc(14px + env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); width: 84px; height: 36px; border-radius: 6px; font-size: 11px; }
#rotate { display: none; text-align: center; color: var(--dim); font-size: 12px; pointer-events: none; padding-inline: 16px; }
body.touch #app { flex-direction: column; }
@media (orientation: portrait) {
  body.touch #app { justify-content: flex-start; padding-top: calc(60px + env(safe-area-inset-top, 0px)); gap: 14px; }
  body.touch #rotate { display: block; }
}
@media (orientation: landscape) {
  body.touch.ingame #screen { width: min(calc(100vw - 300px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)), calc((100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 512 / 342)); }
}

/* high score name entry */
#nameEntry { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.7); z-index: 10; padding-inline: 16px; }
#nameForm { border: 1px solid var(--fg); background: var(--bg); padding: 18px 20px; display: grid; gap: 12px; width: min(320px, 100%); }
#nameForm label { font-size: 13px; letter-spacing: .12em; color: var(--accent); font-weight: 700; }
#nameInput { font: 16px var(--ui); color: var(--fg); background: var(--bg); border: 1px solid var(--dim); padding: 8px 10px; outline: none; }
#nameInput:focus { border-color: var(--accent); }
#nameOk { font: 700 13px var(--ui); letter-spacing: .1em; color: var(--bg); background: var(--fg); border: 0; padding: 9px; cursor: pointer; }
#nameOk:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

<script>
/* SPECTRE — web port.

// Colors: 8-color Mac palette, with level-phase object/horizon colors from vector.p

              orange:'#ff7f00', gray:'#b4b4b4', black:'#000000' };
const PHASES = [ // [objectColor, horizonColor]
  ['#ffff00', [169,0,169]],   // yellow / purple
  ['#ff0064', [67,67,133]],   // burgundy / pale blue
  ['#00c8ff', [120,0,47]],    // turquoise / burgundy

// ---------------------------------------------------------------- utilities
const rnd = (n) => Math.floor(Math.random() * n);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const DEG = Math.PI / 180;
const norm360 = (d) => { d %= 360; return d < 0 ? d + 360 : d; };
const angDiff = (a, b) => { let r = Math.abs(a - b); return r > 180 ? 360 - r : r; };

const approxDist = (ax, ay, bx, by) => { const dx = Math.abs(ax - bx), dy = Math.abs(ay - by); return (Math.max(dx, dy) + dx + dy) / 2; };
// relative angle to obj from base; positive = to the left, range (-180,180]
function angleToObject(bx, by, bdir, ox, oy) {
  const dx = ox - bx, dy = oy - by;
  if (Math.abs(dx) < 1e-9 && Math.abs(dy) < 1e-9) return 0;
  let a = Math.round(Math.atan2(dy, dx) / DEG - bdir);
  while (a > 180) a -= 360; while (a < -179) a += 360;
  return a;

// ---------------------------------------------------------------- shapes
// local coords: x = lateral (right), y = up, z = forward (meters).
function Shape() { return { pts: [], faces: [], edges: [], len: 0, wid: 0, rad: 0 }; }
function addCube(s, mx, my, mz, sx, sy, sz, bxd, bzd) {
  const b = s.pts.length; sx /= 2; sy /= 2; sz /= 2;
  const ax = sx + bxd / 2, az = sz + bzd / 2;
  s.pts.push([mx - ax, my - sy, mz - az], [mx - ax, my - sy, mz + az], [mx - sx, my + sy, mz - sz], [mx - sx, my + sy, mz + sz],
             [mx + ax, my - sy, mz - az], [mx + ax, my - sy, mz + az], [mx + sx, my + sy, mz - sz], [mx + sx, my + sy, mz + sz]);

}
function addCubePlanes(s, bv) {
  const f = [[1,5,6,2],[7,8,6,5],[8,4,2,6],[3,1,2,4],[3,7,5,1],[3,4,8,7]];
  for (const q of f) s.faces.push(q.map(i => bv + i - 1));
}
const P = (s, ...idx) => s.faces.push(idx.map(i => i - 1));
const E = (s, a, b, grp) => s.edges.push([a - 1, b - 1, grp || 0]);
function closeShape(s) {
  for (const [x, , z] of s.pts) {

  }

  const cen = [0, 0, 0]; for (const p of s.pts) { cen[0] += p[0]; cen[1] += p[1]; cen[2] += p[2]; }
  cen[0] /= s.pts.length; cen[1] /= s.pts.length; cen[2] /= s.pts.length;

    const d = n[0] * (fc[0] - cen[0]) + n[1] * (fc[1] - cen[1]) + n[2] * (fc[2] - cen[2]);

}
function faceNormal(pts, f) {

  let nx = 0, ny = 0, nz = 0;

  s = Shape(); s.pts.push([-9, 0, -18 * .29], [9, 0, -18 * .29], [0, 0, 18 * .58], [0, 18 * .96, 0]);

  s = Shape(); for (let i = 0; i < 2; i++) for (let j = 0; j < 8; j++) s.pts.push([6 * Math.cos(j * 45 * DEG), 27 * i, 6 * Math.sin(j * 45 * DEG)]);
  P(s, 1, 2, 3, 4, 5, 6, 7, 8); P(s, 16, 15, 14, 13, 12, 11, 10, 9);
  for (let i = 0; i < 8; i++) { const a = i + 1, b = (i + 1) % 8 + 1; P(s, b, a, a + 8, b + 8); }
  SHAPES[OT.COLUMN] = closeShape(s);
  // wall (double sided)
  s = Shape(); s.pts.push([-cubeSize, 0, 0], [-cubeSize, cubeSize, 0], [cubeSize, cubeSize, 0], [cubeSize, 0, 0]);
  s.double = true; P(s, 1, 2, 3, 4); SHAPES[OT.WALL] = closeShape(s); s.len = Math.max(s.len, 1);
  // windmill
  s = Shape(); addCube(s, 0, 12, 0, 4, 24, 4, 3, 3); addCubePlanes(s, 0);
  for (let i = 0; i < 9; i++) s.pts.push([0, 18, -5]);   // vane tips 9..16, center 17 (animated)
  for (let i = 0; i < 2; i++) { const j = (i + 2) % 4; E(s, i * 2 + 9, j * 2 + 9, 1); E(s, i * 2 + 10, j * 2 + 10, 1); E(s, i * 2 + 9, i * 2 + 10, 1); E(s, j * 2 + 9, j * 2 + 10, 1); }
  closeShape(s); s.len = 10; s.wid = 10; s.rad = 4; s.vanes = true; SHAPES[OT.WINDMILL] = s;
  // shot can: pulsing glowing plate on the ground
  s = Shape(); s.pts.push([-9, 0.05, -9], [-9, 0.05, 9], [9, 0.05, 9], [9, 0.05, -9]); s.double = true; s.glow = true; P(s, 1, 2, 3, 4);
  SHAPES[OT.SHOTCAN] = closeShape(s);
  // player tank
  s = Shape(); const bh = 8 / 3, th = 8 / 3, tl = 16 / 3, gunAlt = bh + th / 2;
  addCube(s, 0, bh / 2, 0, 8, bh, 16, 0, -4); addCube(s, 0, bh + th / 2, 0, 6, th, tl, 0, 0);
  addCube(s, 0, gunAlt + 0.125, (tl + 4) / 2, 0.5, 0.4, 4, 0, 0);
  addCubePlanes(s, 0); addCubePlanes(s, 8); addCubePlanes(s, 16);
  SHAPES[OT.TANK] = closeShape(s);
  // robot tank
  s = Shape(); { const bw = 8, pw = 4, bb = 0, tb = 2, tt = 3, bt = 5, tp = -9, bbp = -4, ps = 1, pf = 9, gt = .25, gb = (tt + bt) / 2;
    const gtb = pf + (ps - pf) * (gb + gt - bb) / (bt - bb), gbb = pf + (ps - pf) * (gb - bb) / (bt - bb), gf = 10;

    E(s,15,19,2);E(s,16,20,2);E(s,17,21,2);E(s,18,22,2);E(s,19,20,2);E(s,20,21,2);E(s,21,22,2);E(s,22,19,2); }
  SHAPES[OT.ROBOT] = closeShape(s);
  // super tank
  s = Shape(); { const bl = 22, rb = -11, fp = 11, rt = -2 + rb, pp = -8, cp = -2, ba = 0, ra = 1, pa = 12, mca = 5, rw = 11, fw = 5.5;
    const rtw = fw * (pa - ra) / pa + (rw - fw) * (rt - fp) / (rb - fp), mw = fw * (pa - mca) / pa + (rw - fw) * (cp - fp) / (rb - fp);
    const gt = 2 / 3, gb = 4, gtp = fp + (pp - fp) * (gb + gt - ba) / (pa - ba), gbp = fp + (pp - fp) * (gb - ba) / (pa - ba);
    s.pts.push([-rw/2,ba,rb],[rw/2,ba,rb],[rtw/2,ra,rt],[-rtw/2,ra,rt],[0,pa,pp],[-mw/2,mca,cp],[mw/2,mca,cp],[-fw/2,ba,fp],[fw/2,ba,fp],
               [-gt/2,gb+gt,gtp],[-gt/2,gb,gbp],[gt/2,gb,gbp],[gt/2,gb+gt,gtp]);
    P(s,5,9,2,3,7); P(s,6,4,1,8,5); P(s,5,8,9); P(s,4,3,2,1); P(s,4,6,7,3); P(s,5,7,6); P(s,2,9,8,1);
    E(s,10,11,3);E(s,11,12,3);E(s,12,13,3);E(s,13,10,3); }
  SHAPES[OT.SUPER] = closeShape(s);
  // shot
  s = Shape(); { const hw = .75, a = gunAlt, sl = 3;
    s.pts.push([-hw,a-hw,-sl/2],[hw,a-hw,-sl/2],[hw,a+hw,-sl/2],[-hw,a+hw,-sl/2],[0,a,sl/2]);
    P(s,4,5,3); P(s,3,5,2); P(s,2,5,1); P(s,1,5,4); P(s,4,3,2,1); }
  closeShape(s); s.len *= 2; s.wid *= 2; s.rad = 4; SHAPES[OT.SHOT] = s;
  // flag: pole + double sided pennant
  s = Shape(); s.pts.push([0,0,0],[0,14,0],[7,14,0],[7,20,0],[0,20,0]); E(s,1,2,0); s.double = true; P(s,2,3,4,5);
  closeShape(s); s.len = 12; s.wid = 12; s.rad = 6; SHAPES[OT.FLAG] = s;

  SHAPES[OT.PYRAMID].ovhd = [[-9,-5.22],[9,-5.22],[0,10.44]];
  SHAPES[OT.COLUMN].ovhd = [...Array(8)].map((_, j) => [6 * Math.cos(j * 45 * DEG), 6 * Math.sin(j * 45 * DEG)]);
  SHAPES[OT.WALL].ovhd = [[-18,0],[18,0]]; SHAPES[OT.WALL].ovhdLine = true;
  SHAPES[OT.WINDMILL].ovhd = [[-5,-5],[5,-5],[5,5],[-5,5]]; SHAPES[OT.WINDMILL].ovhdExtra = [[[-15,-2],[15,-2]]];
  SHAPES[OT.SHOTCAN].ovhd = [[-9,-9],[-9,9],[9,9],[9,-9]];
  SHAPES[OT.TANK].ovhd = [[4,-8],[4,8],[-4,8],[-4,-8]]; SHAPES[OT.TANK].ovhdExtra = [[[3,-2.67],[3,2.67],[-3,2.67],[-3,-2.67],[3,-2.67]],[[0,2.67],[0,6.67]]];
  SHAPES[OT.ROBOT].ovhd = [[4,-9],[4,1],[2,9],[-2,9],[-4,1],[-4,-9]]; SHAPES[OT.ROBOT].ovhdExtra = [[[0,1.5],[0,10]]];
  SHAPES[OT.SUPER].ovhd = [[2.2,-13],[5.5,-11],[2.75,11],[-2.75,11],[-5.5,-11],[-2.2,-13]];
  SHAPES[OT.SHOT].ovhd = [[.75,-1.5],[0,1.5],[-.75,-1.5]];
  SHAPES[OT.FLAG].ovhdCross = true;
}

function setWindmillVanes(phase) {   // SetWindmillVanes
  const s = SHAPES[OT.WINDMILL], L = 15, w2 = 3;
  for (let i = 0; i < 4; i++) {
    let r = w2;
    for (let j = 0; j < 2; j++) {
      r = -r; const a = (phase + 90 * i) * DEG;
      s.pts[8 + i * 2 + j] = [L * Math.cos(a) - r * Math.sin(a), L * Math.sin(a) + r * Math.cos(a) + 18, -5];
    }
  }

    for (let i = 0; i < 3; i++) { const bx = 18 + i * 162; if (x >= bx && x <= bx + 150 && y >= 52 && y <= 242) { if (selTank === i && ev.detail >= 2) begin(); selTank = i; return; } }
    if (x >= 194 && x <= 232 && y >= 266 && y <= 302) selLevel = Math.max(1, selLevel - 1);
    else if (x >= 276 && x <= 314 && y >= 266 && y <= 302) selLevel = Math.min(50, selLevel + 1);
    else if (x >= 334 && x <= 466 && y >= 264 && y <= 306) begin();
  } else if (mode === 'help' || mode === 'about' || mode === 'scores') { lastScoreIdx = -1; setMode('title'); }
  else if (mode === 'game' && G && G.demo) exitDemo();
}

// touch controls
function setupTouch() {
  const stick = document.getElementById('stick'), knob = document.getElementById('knob');
  let sid = null, cx0 = 0, cy0 = 0;
  const upd = (x, y) => {
    const r = stick.getBoundingClientRect(), R = r.width / 2;
    let dx = x - (r.left + R), dy = y - (r.top + R); const m = Math.hypot(dx, dy);
    if (m > R) { dx *= R / m; dy *= R / m; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const nx = dx / R, ny = dy / R;
    touch.fwd = ny < -0.35 ? 1 : ny > 0.35 ? -1 : 0;
    touch.turn = nx < -0.35 ? 1 : nx > 0.35 ? -1 : 0;
  };
  stick.addEventListener('touchstart', (e) => { e.preventDefault(); Sound.unlock(); const t = e.changedTouches[0]; sid = t.identifier; upd(t.clientX, t.clientY); }, { passive: false });
  stick.addEventListener('touchmove', (e) => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === sid) upd(t.clientX, t.clientY); }, { passive: false });
  const end = (e) => { for (const t of e.changedTouches) if (t.identifier === sid) { sid = null; touch.fwd = 0; touch.turn = 0; knob.style.transform = ''; } };
  stick.addEventListener('touchend', end); stick.addEventListener('touchcancel', end);
  const hold = (id, on, off) => { const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); Sound.unlock(); el.classList.add('down'); on(); }, { passive: false });
    const up = (e) => { e.preventDefault(); el.classList.remove('down'); if (off) off(); };
    el.addEventListener('touchend', up); el.addEventListener('touchcancel', up);
    el.addEventListener('mousedown', (e) => { e.preventDefault(); Sound.unlock(); on(); }); el.addEventListener('mouseup', () => { if (off) off(); }); };
  hold('bFire', () => { touch.fire = true; if (G && !G.demo) doFire(false); }, () => { touch.fire = false; });
  hold('bGren', () => { touch.gren = true; }, () => { touch.gren = false; });
  hold('bHyper', () => { if (G && G.phase === 'play' && !G.demo) hyperSpace(G.players[1]); });
  hold('bView', () => cycleView());
  hold('bPause', () => { if (G) { if (G.demo) exitDemo(); else G.paused = !G.paused; } });
  hold('bQuit', () => { if (G && G.paused) { G = null; setMode('title'); } });
  hold('bSound', () => { Sound.toggle(); updateTouchUI(); });
}
function updateTouchUI() {
  const ui = document.getElementById('touchUI');
  const inGame = mode === 'game' && G && !G.demo;
  document.body.classList.toggle('ingame', !!inGame);
  ui.style.display = isTouch ? 'block' : 'none';
  document.getElementById('bSound').textContent = Sound.on ? 'SOUND ON' : 'SOUND OFF';
  document.getElementById('bGren').style.opacity = (G && G.level >= 10) ? '1' : '.3';
  document.getElementById('bQuit').style.display = (G && G.paused) ? 'flex' : 'none';
}

// ---------------------------------------------------------------- main loop
let lastT = 0, acc = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (!lastT) lastT = t;
  let dt = t - lastT; lastT = t; if (dt > 250) dt = 250;
  acc += dt;
  let n = 0;
  while (acc >= ONE_TICK && n < 8) {
    acc -= ONE_TICK; n++; modeT++;
    if (mode === 'game' && G) gameTick();
    if (mode === 'title' && modeT > 60 * 30) menuPick(1);   // drop into the demo when idle
  }
  if (n === 8) acc = 0;
  resize();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.lineWidth = 1;
  if (mode === 'game' && G) { if (G.phase === 'over') renderOver(); else renderGame(); }
  else if (mode === 'title') renderTitle();
  else if (mode === 'select') renderSelect();
  else if (mode === 'help') renderHelp();
  else if (mode === 'about') renderAbout();
  else if (mode === 'scores') renderScores();
  if (isTouch && (frame.k = (frame.k || 0) + 1) % 15 === 0) updateTouchUI();
}
let lastSize = '';
function resize() {
  const wrap = document.getElementById('screen');
  const r = wrap.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 3);
  const key = r.width + 'x' + r.height + '@' + dpr; if (key === lastSize) return; lastSize = key;
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  scale = canvas.width / W;
}

function boot(data) {
  VFONT = data.font;
  for (const w of data.worlds) WORLDS.push(w);
  buildShapes();
  Sound.init(data.snd);
  aboutImg = new Image(); aboutImg.src = 'data:image/png;base64,' + data.img.about;
  canvas = document.getElementById('c'); ctx = canvas.getContext('2d');
  window.addEventListener('keydown', onKeyDown); window.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (G && !G.demo && G.phase === 'play') G.paused = true; });
  canvas.addEventListener('click', onCanvasClick);
  // iOS only counts touchend/click (not touchstart) as a gesture that may start audio.
  for (const ev of ['touchend', 'click', 'keydown', 'pointerup']) document.addEventListener(ev, () => Sound.unlock(), { capture: true, passive: true });
  document.addEventListener('visibilitychange', () => { if (document.hidden && G && !G.demo && G.phase === 'play') G.paused = true; });
  setupTouch(); updateTouchUI();
  requestAnimationFrame(frame);
}
window.SPECTRE = { boot, get G() { return G; }, get mode() { return mode; }, setMode, startGame, OT };
